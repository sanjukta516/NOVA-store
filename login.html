<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 75px;

            background: white;

            display: flex;
            align-items: center;

            padding: 0 30px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.15);
        }


        .back-button {
            background: none;
            border: none;

            font-size: 28px;

            cursor: pointer;
        }


        .company {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-left: 25px;
        }


        .company img {
            width: 45px;
            height: 45px;

            object-fit: contain;
        }


        .company h1 {
            margin: 0;

            font-size: 25px;

            font-family: Georgia, serif;

            color: #4d0404ce;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-page {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }


        .login-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }


        .login-box h2 {

            text-align: center;

            font-size: 30px;

            margin: 0 0 10px;
        }


        .login-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {

            border-color: #4d0404;
        }


        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 6px;

            background: #4d0404ce;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .login-button:hover {

            background: #300000;
        }


        .signup-text {

            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 14px;
        }


        .signup-text a {

            color: #4d0404;

            font-weight: bold;

            text-decoration: none;
        }


        .signup-text a:hover {

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background: #222;

            color: white;

            text-align: center;

            padding: 15px;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <button
            class="back-button"
            onclick="history.back()"
        >
            ←
        </button>


        <div class="company">

            <img
                src="logo.png"
                alt="NOVA"
            >

            <h1>NOVA</h1>

        </div>

    </header>



    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-box">

            <h2>
                Welcome Back
            </h2>


            <p class="login-subtitle">
                Sign in to your NOVA account
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>

        </div>

    </main>



    <footer>

        © 2026 NOVA. All Rights Reserved.

    </footer>
<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                const response =
                    await fetch("/api/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })

                    });


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.error ||
                        "Login failed."
                    );

                    return;

                }

                localStorage.setItem(
                    "novaUser",
                    JSON.stringify(result.user)
                );
                alert(
                    "Welcome back, " +
                    result.user.name +
                    "! 🎉"
                );


                /*
                    For now, just go to
                    the homepage.
                */

                window.location.href =
                    "sample2.html";


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                alert(
                    "Could not connect to the server."
                );

            }

        });

</script>

</body>

</html>
