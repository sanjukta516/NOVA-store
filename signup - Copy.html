<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA - Create Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            height: 75px;
            background: white;

            display: flex;
            align-items: center;

            padding: 0 30px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .back-button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        .company {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 25px;
        }

        .company img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .company h1 {
            margin: 0;
            font-size: 25px;
            font-family: Georgia, serif;
            color: #4d0404ce;
        }

        .signup-page {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        .signup-box h2 {
            text-align: center;
            font-size: 30px;
            margin: 0 0 10px;
        }

        .signup-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4d0404;
        }

        .signup-button {
            width: 100%;

            padding: 14px;
            margin-top: 5px;

            border: none;
            border-radius: 6px;

            background: #4d0404ce;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .signup-button:hover {
            background: #300000;
        }

        .login-text {
            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 14px;
        }

        .login-text a {
            color: #4d0404;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <header>

        <button
            class="back-button"
            onclick="history.back()"
        >
            ←
        </button>


        <div class="company">

            <img
                src="logo.png"
                alt="NOVA"
            >

            <h1>NOVA</h1>

        </div>

    </header>



    <main class="signup-page">

        <div class="signup-box">

            <h2>
                Create Account
            </h2>

            <p class="signup-subtitle">
                Join NOVA today
            </p>


            <form id="signupForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>

<script>

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* Check passwords */

            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;

            }


            try {

                const response =
                    await fetch("/api/signup", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,
                            email: email,
                            password: password

                        })

                    });


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.error ||
                        "Could not create account."
                    );

                    return;

                }


                alert(
                    "Account created successfully! 🎉"
                );


                /* Go to login */

                window.location.href =
                    "login.html";


            } catch (error) {

                console.error(
                    "Signup error:",
                    error
                );

                alert(
                    "Could not connect to the server."
                );

            }

        });

</script>
</body>

</html>
