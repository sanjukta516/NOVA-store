<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA - Edit Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7eeee;
            color: #333;
        }

        .header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #650505;
            letter-spacing: 2px;
        }

        .retailer-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .retailer-name {
            font-weight: bold;
        }

        .logout-button {
            padding: 9px 16px;
            border: 1px solid #650505;
            background: white;
            color: #650505;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background: #f8eeee;
        }

        .dashboard {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 230px;
            background: white;
            border-right: 1px solid #eee;
            padding: 30px 20px;
        }

        .sidebar h2 {
            color: #650505;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            padding: 13px 15px;
            margin-bottom: 8px;
            color: #444;
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #f7eeee;
            color: #650505;
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            padding: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            color: #650505;
        }

        .page-header p {
            color: #666;
        }

        .form-container {
            max-width: 900px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #650505;
        }

        .current-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .save-button {
            padding: 12px 22px;
            background: #650505;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button:hover {
            background: #4d0404;
        }

        .cancel-button {
            padding: 12px 22px;
            background: white;
            color: #650505;
            border: 1px solid #650505;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-button:hover {
            background: #f8eeee;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 750px) {

            .sidebar {
                width: 190px;
            }

            .main-content {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            NOVA
        </div>

        <div class="retailer-info">

            <span
                class="retailer-name"
                id="retailerName"
            >
                Retailer
            </span>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <div class="dashboard">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>
                Seller Panel
            </h2>

            <a href="retailer-dashboard.html">
                Dashboard
            </a>

            <a
                href="retailer-products.html"
                class="active"
            >
                Products
            </a>

            <a href="retailer-orders.html">
                Orders
            </a>

            <a href="retailer-inventory.html">
                Inventory
            </a>

            <a href="retailer-reviews.html">
                Reviews
            </a>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">

            <div class="page-header">

                <h1>
                    Edit Product
                </h1>

                <p>
                    Update your NOVA product information.
                </p>

            </div>


            <div class="form-container">

                <form id="editProductForm">


                    <div class="form-grid">


                        <!-- PRODUCT NAME -->

                        <div class="form-group">

                            <label for="productName">
                                Product Name
                            </label>

                            <input
                                type="text"
                                id="productName"
                                required
                            >

                        </div>


                        <!-- CATEGORY -->

                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select
                                id="category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Smartphone">
                                    Smartphone
                                </option>

                                <option value="Laptop">
                                    Laptop
                                </option>

                                <option value="Tablet">
                                    Tablet
                                </option>

                                <option value="Audio">
                                    Audio
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Smart Home">
                                    Smart Home
                                </option>

                            </select>

                        </div>


                        <!-- PRICE -->

                        <div class="form-group">

                            <label for="price">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                id="price"
                                min="0"
                                step="1"
                                required
                            >

                        </div>


                        <!-- STOCK -->

                        <div class="form-group">

                            <label for="stock">
                                Stock
                            </label>

                            <input
                                type="number"
                                id="stock"
                                min="0"
                                step="1"
                                value="0"
                                required
                            >

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="form-group full-width">

                            <label for="description">
                                Description
                            </label>

                            <textarea
                                id="description"
                                required
                            ></textarea>

                        </div>


                        <!-- IMAGE -->

                        <div class="form-group full-width">

    <label>
        Product Images
    </label>

    <img
        id="productImage"
        class="current-image"
        src="logo.png"
        alt="Product image"
    >

    <input
        type="text"
        id="image"
        placeholder="Main image path, e.g. images/nova-x1.jpg"
    >

    <br>

    <label>
        Additional Images
    </label>
    <div id="existingImages"></div>
    <div id="additionalImages">

        <input
            type="text"
            class="additional-image"
            placeholder="Image 2 path"
        >

    </div>

    <button
        type="button"
        class="cancel-button"
        style="margin-top: 10px;"
        onclick="addImageField()"
    >
        + Add Another Image
    </button>

</div>


                    </div>


                    <div class="button-row">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            Save Changes
                        </button>

                        <button
                            type="button"
                            class="cancel-button"
                            onclick="window.location.href='retailer-products.html'"
                        >
                            Cancel
                        </button>

                    </div>


                    <div
                        id="message"
                        class="message"
                    ></div>


                </form>

            </div>

        </main>

    </div>


    <script>

        /* CHECK LOGIN */

        const retailer =
            JSON.parse(
                localStorage.getItem("novaRetailer")
            );

        if (!retailer) {

            window.location.href =
                "retailer-login.html";

        }


        if (retailer) {

            document.getElementById(
                "retailerName"
            ).textContent =
                retailer.name;

        }


        /* GET PRODUCT ID FROM URL */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const productId =
            urlParams.get("id");


        /* LOAD PRODUCT */

        async function loadProduct() {

            if (!productId) {

                document.getElementById(
                    "message"
                ).textContent =
                    "No product selected.";

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/product/" +
                        productId
                    );

                const product =
                    await response.json();


                document.getElementById(
                    "productName"
                ).value =
                    product.name || "";


                document.getElementById(
                    "category"
                ).value =
                    product.category || "";


                document.getElementById(
                    "price"
                ).value =
                    product.price || "";


                document.getElementById(
                    "description"
                ).value =
                    product.description || "";


                document.getElementById(
                    "image"
                ).value =
                    product.image || "";


                document.getElementById(
                    "productImage"
                ).src =
                    product.image || "logo.png";


            } catch (error) {

                console.error(
                    "Could not load product:",
                    error
                );

                document.getElementById(
                    "message"
                ).textContent =
                    "Could not load product.";

            }

        }
        async function loadExistingImages() {
    const container = document.getElementById("existingImages");

    try {
        const response = await fetch("/api/product/" + productId + "/images");
        const images = await response.json();

        container.innerHTML = "";

        if (images.length === 0) {
            container.innerHTML = "<p style='color:#777;'>No additional images added yet.</p>";
            return;
        }

        images.forEach(image => {
            const imageRow = document.createElement("div");

            imageRow.style.display = "flex";
            imageRow.style.alignItems = "center";
            imageRow.style.gap = "15px";
            imageRow.style.marginBottom = "15px";
            imageRow.style.padding = "10px";
            imageRow.style.border = "1px solid #ddd";
            imageRow.style.borderRadius = "8px";

            imageRow.innerHTML = `
                <img
                    src="${image.image_url}"
                    style="width:80px;height:80px;object-fit:contain;border-radius:6px;"
                >

                <span style="flex:1;">
                    ${image.image_url}
                </span>

                <button
                    type="button"
                    class="delete-image-button"
                    onclick="deleteProductImage(${image.id})"
                >
                    🗑️ Delete
                </button>
            `;

            container.appendChild(imageRow);
        });

    } catch (error) {
        console.error("Could not load existing images:", error);
        container.innerHTML = "<p style='color:#777;'>Could not load images.</p>";
    }
}
async function deleteProductImage(imageId) {
    const confirmed = confirm("Are you sure you want to delete this image?");

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch("/api/product-image/" + imageId, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message || "Could not delete image.");
            return;
        }

        alert("Image deleted successfully!");

        loadExistingImages();

    } catch (error) {
        console.error("Delete image error:", error);
        alert("Could not delete image.");
    }
}


        /* IMAGE PREVIEW */

        document.getElementById(
            "image"
        ).addEventListener(
            "input",
            function() {

                const image =
                    this.value.trim();

                document.getElementById(
                    "productImage"
                ).src =
                    image || "logo.png";
                    

            }
            
        );
        function addImageField() {

    const container =
        document.getElementById(
            "additionalImages"
        );

    const input =
        document.createElement("input");

    input.type = "text";

    input.className =
        "additional-image";

    input.placeholder =
        "Additional image path";

    input.style.marginTop =
        "10px";

    container.appendChild(input);

}


        /* LOGOUT */

        function logout() {

            localStorage.removeItem(
                "novaRetailer"
            );

            window.location.href =
                "retailer-login.html";

        }


        /* FORM */

        document.getElementById("editProductForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const productData = {
        name: document.getElementById("productName").value.trim(),
        category: document.getElementById("category").value,
        price: document.getElementById("price").value,
        stock: document.getElementById("stock").value,
        description: document.getElementById("description").value.trim(),
        image: document.getElementById("image").value.trim()
    };

    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/product/" + productId, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(productData)
        });

        const result = await response.json();

        if (!response.ok) {
            message.textContent = result.message || "Failed to update product.";
            return;
        }

        message.textContent = "Product updated successfully!";

    } catch (error) {
        console.error("Update error:", error);
        message.textContent = "Could not save product.";
    }
});


        loadProduct();
        loadExistingImages();

    </script>

</body>

</html>
