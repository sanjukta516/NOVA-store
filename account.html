<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA - My Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            height: 75px;
            background: white;

            display: flex;
            align-items: center;

            padding: 0 30px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .back-button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        .company {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 25px;
        }

        .company img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .company h1 {
            margin: 0;
            font-size: 25px;
            font-family: Georgia, serif;
            color: #4d0404ce;
        }

        .account-page {
            max-width: 700px;
            margin: auto;
            padding: 60px 25px;
        }

        .account-box {
            background: white;
            border-radius: 12px;
            padding: 40px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        .account-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 15px;
        }

        .account-box h2 {
            text-align: center;
            font-size: 30px;
            margin: 0 0 8px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
        }

        .info-row {
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
        }

        .logout-button {
            width: 100%;
            padding: 14px;
            margin-top: 30px;

            border: none;
            border-radius: 6px;

            background: #4d0404ce;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #300000;
        }

    </style>

</head>


<body>


    <header>

        <button
            class="back-button"
            onclick="history.back()"
        >
            ←
        </button>


        <div class="company">

            <img
                src="logo.png"
                alt="NOVA"
            >

            <h1>NOVA</h1>

        </div>

    </header>



    <main class="account-page">

        <div class="account-box">

            <div class="account-icon">
                👤
            </div>


            <h2>
                My Account
            </h2>


            <p
                class="welcome"
                id="welcomeText"
            >
                Loading account...
            </p>


            <div class="info-row">

                <div class="info-label">
                    NAME
                </div>

                <div
                    class="info-value"
                    id="userName"
                >
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    EMAIL
                </div>

                <div
                    class="info-value"
                    id="userEmail"
                >
                </div>

            </div>


            <button
                class="logout-button"
                onclick="logout()"
            >
                Log Out
            </button>

        </div>

    </main>



    <script>

        const storedUser =
            localStorage.getItem("novaUser");


        /*
         * If nobody is logged in,
         * send them to Login.
         */

        if (!storedUser) {

            window.location.href =
                "login.html";

        }


        else {

            const user =
                JSON.parse(storedUser);


            document.getElementById(
                "userName"
            ).textContent =
                user.name;


            document.getElementById(
                "userEmail"
            ).textContent =
                user.email;


            document.getElementById(
                "welcomeText"
            ).textContent =
                "Welcome back, " +
                user.name + "!";

        }


        function logout() {

            localStorage.removeItem(
                "novaUser"
            );

            window.location.href =
                "login.html";

        }

    </script>


</body>

</html>
