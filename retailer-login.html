<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA Retailer Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7eeee;
            color: #333;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #650505;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .retailer-title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
            color: #555;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #650505;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #650505;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4d0404;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #650505;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .login-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                NOVA
            </div>

            <div class="retailer-title">
                Retailer Login
            </div>

            <form id="retailerLoginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter retailer email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <div
                id="loginMessage"
                class="login-message"
            ></div>

            <a
                href="sample2.html"
                class="back-link"
            >
                🡄 Back to NOVA
            </a>

        </div>

    </div>


    <script>

        document
    .getElementById("retailerLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");

        try {

            const response = await fetch(
                "/api/retailer-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const result =
                await response.json();

            if (result.success) {

                localStorage.setItem(
                    "novaRetailer",
                    JSON.stringify(result.retailer)
                );

                window.location.href =
                    "retailer-dashboard.html";

            } else {

                message.textContent =
                    result.message;

                message.style.color = "#b00020";

            }

        } catch (error) {

            console.error(
                "Retailer login failed:",
                error
            );

            message.textContent =
                "Something went wrong. Please try again.";

            message.style.color = "#b00020";

        }

    });
        

    </script>

</body>

</html>
